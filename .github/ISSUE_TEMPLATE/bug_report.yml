name: Bug 报告
description: 报告可复现的问题（DSH 面板、插件、Python 采集或安装）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现步骤和版本信息；贴日志前先移除 token、密码、内网地址等敏感内容。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复问题
          required: true
        - label: 我已阅读 README / 使用说明
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - DSH 侧边栏面板
        - 输入框下方挂件
        - hardware_monitor_status 工具
        - Python 采集服务 / API
        - 安装 / 启动
        - 文档
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动服务开始，写清楚每一步操作
      placeholder: |
        1. 启动 ...
        2. 打开 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包括报错文字、面板空白/离线的具体表现
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 插件 / 仓库版本
      description: dsh-hardware-monitor 版本或 git commit
      placeholder: "例如：dsh-hardware-monitor 1.1.9"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - Ubuntu 22.04
        - Ubuntu 24.04
        - 其他 Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 可选；请先脱敏
      placeholder: |
        相关日志片段、截图链接或复现仓库
    validations:
      required: false
