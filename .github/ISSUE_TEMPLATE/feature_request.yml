name: 功能建议
description: 建议新的指标、展示方式、平台支持或使用体验
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议。请说明要解决的问题，而不只是实现方式；这样更容易判断是否适合插件。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复建议
          required: true
        - label: 我已阅读 README / 使用说明
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      options:
        - DSH 侧边栏面板
        - 输入框下方挂件
        - hardware_monitor_status 工具
        - Python 采集服务 / API
        - 安装 / 启动
        - 文档
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便 / 缺少什么信息
      placeholder: "例如：我希望在面板里直接看到 ...，现在需要 ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以描述交互、布局或数据来源；不要求完整实现
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考项目、平台限制等；请先脱敏
    validations:
      required: false
